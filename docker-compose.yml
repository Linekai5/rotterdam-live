services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    image: rotterdam_live_postgis:16
    container_name: rotterdam_live_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rotterdamlive_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-rotterdamlive}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rotterdamlive}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rotterdam_net

  redis:
    image: redis:7-alpine
    container_name: rotterdam_live_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rotterdam_net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rotterdam_live_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-rotterdamlive_secret_2026}@db:5432/${POSTGRES_DB:-rotterdamlive}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-rotterdamlive_secret_2026}@db:5432/${POSTGRES_DB:-rotterdamlive}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    command: >
      sh -c "python scripts/init_db.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - rotterdam_net

  ingestion_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rotterdam_live_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-rotterdamlive_secret_2026}@db:5432/${POSTGRES_DB:-rotterdamlive}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-rotterdamlive_secret_2026}@db:5432/${POSTGRES_DB:-rotterdamlive}
      REDIS_URL: redis://redis:6379/0
    command: python worker.py
    depends_on:
      api:
        condition: service_healthy
    networks:
      - rotterdam_net

volumes:
  pgdata:
    name: rotterdam_live_pgdata
  redisdata:
    name: rotterdam_live_redisdata

networks:
  rotterdam_net:
    name: rotterdam_live_network
    driver: bridge
