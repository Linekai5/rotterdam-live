[project]
name = "rotterdam-live-api"
version = "1.0.0"
description = "Unified Backend Data Engine for Rotterdam Live (rotterdamlive.nl)"
authors = [{ name = "Alkai1", email = "101726@glr.nl" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.15.0",
    "shapely>=2.0.5",
    "redis>=5.0.8",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "loguru>=0.7.2",
    "feedparser>=6.0.11",
    "gtfs-realtime-bindings>=1.0.0",
    "alembic>=1.13.2",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
