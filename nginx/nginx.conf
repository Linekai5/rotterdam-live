user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/geo+json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting: 60 requests/sec with burst buffer
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=60r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;
    limit_conn addr_conn_limit 100;

    # SSL Global Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Upstream Services
    upstream web_upstream {
        server web:80;
        keepalive 32;
    }

    upstream api_upstream {
        server api:8000;
        keepalive 32;
    }

    # =========================================================================
    # 1. PUBLIC HTTP SERVER (Container Port 80)
    # Mapped from host ${PUBLIC_BIND_ADDRESS}:80
    # =========================================================================
    server {
        listen 80;
        server_name rotterdamlive.nl www.rotterdamlive.nl;

        # Let's Encrypt HTTP-01 challenge verification
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # Enforce HTTPS redirect for all other traffic
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Fallback for unrecognized HTTP host header
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            return 444;
        }
    }

    # =========================================================================
    # 2. PUBLIC HTTPS SERVER (Container Port 443)
    # Mapped from host ${PUBLIC_BIND_ADDRESS}:443
    # =========================================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name rotterdamlive.nl www.rotterdamlive.nl;

        ssl_certificate /etc/letsencrypt/live/rotterdamlive.nl/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rotterdamlive.nl/privkey.pem;

        # Hardened Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ACME renewal path fallback
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Public API Gateway proxy (rate limited)
        location /api/ {
            limit_req zone=api_rate_limit burst=60 nodelay;

            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Sub-30ms GeoJSON SLA optimization
            proxy_pass_header ETag;
            proxy_buffering off;
            proxy_read_timeout 30s;
        }

        # Public API Health Checks
        location /health {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Public Frontend Web App (Svelte + MapLibre GL)
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # =========================================================================
    # 3. PRIVATE TAILSCALE API GATEWAY (Container Port 8080)
    # Mapped from host ${PRIVATE_BIND_ADDRESS}:80:8080
    # Strict Invariant: Plain HTTP over Tailscale WireGuard tunnel
    # =========================================================================
    server {
        listen 8080;
        server_name api.rotterdamlive.nl localhost;

        # Hardened Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Route all paths to FastAPI backend
        location / {
            limit_req zone=api_rate_limit burst=60 nodelay;

            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;

            # Sub-30ms GeoJSON SLA optimization
            proxy_pass_header ETag;
            proxy_buffering off;
            proxy_read_timeout 30s;
        }
    }
}
