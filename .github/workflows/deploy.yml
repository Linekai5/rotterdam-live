name: Production Deployment Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Zero-Downtime Rolling Production Deploy
    runs-on: [self-hosted, rotterdam-vps]
    steps:
      - name: Execute Rolling Production Deployment
        run: |
          set -euo pipefail
          cd /home/homeaccount/rotterdam-live

          echo "==> Pulling latest repository state..."
          git fetch origin main
          git reset --hard origin/main

          echo "==> Pre-building production container images..."
          docker compose -f docker-compose.prod.yml build

          echo "==> Rolling update: Backend API..."
          docker compose -f docker-compose.prod.yml up -d --no-deps api
          
          echo "==> Awaiting Backend API healthy status..."
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml exec -T api curl -fsS http://localhost:8000/health/live >/dev/null 2>&1; then
              echo "API is healthy!"
              break
            fi
            sleep 2
          done

          echo "==> Rolling update: Frontend Web..."
          docker compose -f docker-compose.prod.yml up -d --no-deps web

          echo "==> Rolling update: Background Ingestion Worker..."
          docker compose -f docker-compose.prod.yml up -d --no-deps ingestion_worker

          echo "==> Graceful Nginx configuration reload..."
          if docker compose -f docker-compose.prod.yml ps nginx | grep -q "Up"; then
            docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload
          else
            docker compose -f docker-compose.prod.yml up -d --no-deps nginx
          fi

          echo "==> Verifying live production health..."
          curl -fsS http://127.0.0.1:8000/health/live

          echo "==> Cleaning stale build artifacts..."
          docker image prune -f

          echo "==> Deployment completed successfully!"
