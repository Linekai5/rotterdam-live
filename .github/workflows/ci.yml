name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Path Filtering
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      nginx: ${{ steps.filter.outputs.nginx }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filter Detection
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            nginx:
              - 'nginx/**'
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'

  test-api:
    name: Backend API Tests (PostGIS + Redis)
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rotterdamlive_secret_2026
          POSTGRES_DB: rotterdamlive
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'api/requirements.txt'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libexpat1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Initialization
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://postgres:rotterdamlive_secret_2026@127.0.0.1:5432/rotterdamlive
          DATABASE_URL_SYNC: postgresql://postgres:rotterdamlive_secret_2026@127.0.0.1:5432/rotterdamlive
          REDIS_URL: redis://127.0.0.1:6379/0
          ENVIRONMENT: testing
        run: |
          python scripts/init_db.py

      - name: Execute Pytest Suite (Sub-30ms SLA Verification)
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://postgres:rotterdamlive_secret_2026@127.0.0.1:5432/rotterdamlive
          DATABASE_URL_SYNC: postgresql://postgres:rotterdamlive_secret_2026@127.0.0.1:5432/rotterdamlive
          REDIS_URL: redis://127.0.0.1:6379/0
          ENVIRONMENT: testing
        run: |
          pytest -v --durations=10

  test-web:
    name: Frontend Web Suite (Svelte + Vite)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Unit & Spatial Tests
        run: npm test

      - name: Run Production Bundle Build
        run: npm run build

  lint-nginx:
    name: Nginx Configuration Validation
    needs: changes
    if: ${{ needs.changes.outputs.nginx == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Nginx Syntax inside Container
        run: |
          mkdir -p /tmp/certs/live/rotterdamlive.nl
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout /tmp/certs/live/rotterdamlive.nl/privkey.pem \
            -out /tmp/certs/live/rotterdamlive.nl/fullchain.pem \
            -subj "/CN=rotterdamlive.nl"
          docker run --rm \
            --add-host=api:127.0.0.1 --add-host=web:127.0.0.1 \
            -v ${{ github.workspace }}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v /tmp/certs:/etc/letsencrypt:ro \
            nginx:stable-alpine \
            nginx -t -c /etc/nginx/nginx.conf
