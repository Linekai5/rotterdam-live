name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tree:
    name: Public Repository Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Tracked Files
        run: python3 scripts/check-public-tree.py

      - name: Test Publication Checks
        run: python3 -m unittest discover -s scripts/tests

  changes:
    name: Path Filtering
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      nginx: ${{ steps.filter.outputs.nginx }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Path Filter Detection
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            nginx:
              - 'nginx/**'
              - '.github/workflows/ci.yml'

  test-web:
    name: Frontend Web Suite (Svelte + Vite)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Unit & Spatial Tests
        run: npm test

      - name: Run Production Bundle Build
        run: npm run build

  lint-nginx:
    name: Nginx Configuration Validation
    needs: changes
    if: ${{ needs.changes.outputs.nginx == 'true' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Nginx Syntax inside Container
        run: |
          mkdir -p /tmp/certs/live/rotterdamlive.nl
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout /tmp/certs/live/rotterdamlive.nl/privkey.pem \
            -out /tmp/certs/live/rotterdamlive.nl/fullchain.pem \
            -subj "/CN=rotterdamlive.nl"
          mkdir -p /tmp/nginx_certs
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout /tmp/nginx_certs/api.rotterdamlive.nl.key \
            -out /tmp/nginx_certs/api.rotterdamlive.nl.crt \
            -subj "/CN=api.rotterdamlive.nl"
          docker run --rm \
            --add-host=api:127.0.0.1 --add-host=web:127.0.0.1 \
            -v ${{ github.workspace }}/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v /tmp/certs:/etc/letsencrypt:ro \
            -v /tmp/nginx_certs:/etc/nginx/certs:ro \
            nginx:stable-alpine \
            nginx -t -c /etc/nginx/nginx.conf
